name: publish to comfy registry

# The release switch is `version` in pyproject.toml, not this file. A push to
# main that changes that file publishes that version, which is why the trigger
# is scoped to the one path rather than to the whole branch: ordinary commits
# do not reach the registry. The registry also refuses to overwrite a version
# that already exists, so a push that leaves the number alone is a no-op even
# if the path filter is somehow satisfied.
#
# Publishing by hand is still possible from Actions -> "publish to comfy
# registry" -> Run workflow.
#
# Needs the repository secret REGISTRY_ACCESS_TOKEN (Settings -> Secrets and
# variables -> Actions) and a `[tool.comfy].PublisherId` matching the registry
# publisher.

on:
  workflow_dispatch:

  push:
    branches: [main]
    paths: [pyproject.toml]

jobs:
  # The whole of tests.yml -- ruff plus the 385-test suite -- called as a
  # reusable workflow rather than copied. Called with a relative path, so it runs
  # the tests *from the commit being published*, not from whatever main happens
  # to hold. That is the difference between this and a `workflow_run` trigger,
  # which fires after any tests.yml run finishes and would need extra logic to
  # tie the result back to the right commit.
  #
  # What green means here: lint and the CPU suite. It does NOT mean the GPU
  # smoke tests passed -- those need an H100 and are run from a cluster by hand
  # (see CONTRIBUTING.md). Run them before bumping the version.
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    # Gate: the registry is only reached if every job in `test` succeeded. A
    # failed or cancelled run stops here, so a broken commit cannot be
    # published -- which is the point of the split.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Respects .comfyignore, so the archive excludes tests/, slurm/, scripts/
      # and .github/ while keeping the docs the listing renders.
      - uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
