name: tests

# The suite needs no GPU and runs in about five seconds locally. What costs
# time here is the environment: importing the node layer pulls `comfy_api`,
# which pulls torch, av, einops, safetensors and comfy-kitchen. So the lint job
# is split out to give a fast answer on the common failure, and the test job
# installs ComfyUI's own requirements against a CPU torch wheel.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Callable from publish.yml, so a release runs these first and runs them from
  # the same commit it is about to publish. Adding this changes nothing about
  # how the workflow behaves on a push.
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ComfyUI-TrajectoryForcing

      # Shallow, and only for its Python packages: nothing here starts a
      # server. `tests/conftest.py` finds it at ../ComfyUI relative to the
      # extension, which is the layout checked out above.
      - uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          path: ComfyUI
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # CPU wheels throughout: the tests exercise schemas, edit maths and drawing,
      # none of which touches a device.
      #
      # `jax` is here for one reason. `tests/test_tf_import.py` covers the
      # namespace swap -- the load-bearing trick of this extension, and the
      # sharpest edge in CONTRIBUTING -- by importing TrajectoryForcing's
      # `utils.vis_util`, whose first line is `import jax.numpy`. Without it those
      # five tests fail, and skipping them would leave CI not covering the one
      # thing hardest to get right. The CPU wheel is enough; nothing here needs
      # CUDA, and no `jax[cuda12]` means no fight with torch over CUDA libraries.
      #
      # The rest of the JAX stack (flax, orbax, ml_collections) is deliberately
      # absent -- the suite never loads a real model. `check_runtime_deps` is
      # tested against stubbed dependency lists, so it does not care either way.
      - name: Install
        run: |
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r ComfyUI/requirements.txt
          pip install jax pytest

      # `tests/conftest.py` finds ComfyUI by walking up from the extension, which
      # resolves in a normal side-by-side checkout and lands one level too high
      # on a runner ($GITHUB_WORKSPACE is itself nested). Without this the whole
      # `requires_comfy` half of the suite -- every node schema and execute test,
      # ~200 of them -- skips, pytest finishes in three seconds, and CI goes green
      # having checked almost nothing. Naming the path removes the guesswork.
      - name: Check ComfyUI is where the tests expect
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/ComfyUI
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, "ComfyUI-TrajectoryForcing/tests")
          import conftest
          if conftest.COMFY_ROOT is None:
              sys.exit(
                  "conftest could not find ComfyUI, so the suite would silently skip "
                  f"every test that needs it. COMFYUI_ROOT={os.environ.get('COMFYUI_ROOT')!r}"
              )
          print("ComfyUI found at", conftest.COMFY_ROOT)
          EOF

      - name: pytest
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/ComfyUI
        # -p no:cacheprovider: nothing to reuse on a fresh runner.
        # --durations: the fast-run symptom above is worth seeing at a glance.
        run: pytest ComfyUI-TrajectoryForcing/tests -q -p no:cacheprovider --durations=5
