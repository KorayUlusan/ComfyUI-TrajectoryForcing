# This directory is the pytest rootdir, deliberately.
#
# The repository root is itself an importable package (ComfyUI loads
# `__init__.py` as the custom node's module), so a pytest run rooted there
# builds a Package node for it and tries to import `__init__` as a top-level
# module -- which fails on its relative imports before a single test runs.
# Rooting the run here keeps the collection tree inside `tests/`.
[pytest]
testpaths = .
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:jax.*
