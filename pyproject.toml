[project]
name = "comfyui-trajectoryforcing"
# Ends with the pointer on purpose. This is the one line shown on the registry
# listing and in ComfyUI-Manager, and installing is not a single click: the nodes
# need CUDA 12 and their own environment, so somebody who installs on the
# strength of the description alone gets a node that refuses to run. Say that
# where they will read it.
description = "Coarse-to-fine generation and interactive latent-token editing from Trajectory Forcing, as ComfyUI nodes. Needs CUDA 12 and its own Python environment -- read the README on GitHub before installing."
version = "0.1.6"
# A PEP 639 SPDX identifier, not `{ file = "LICENSE" }`. Both are valid per the
# registry spec, but comfy-cli's serialize_license prefers `file` when it is set
# and ships the dict verbatim, so the listing page showed the literal string
# {"file": "LICENSE"} where the licence name belongs. A plain string arrives as
# {"text": "MIT"}, which is what comfy-cli's own scaffolding generates.
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
# Deliberately empty. The heavy dependencies (JAX, flax, torch, transformers)
# belong to TrajectoryForcing and are pinned there; installing them from here
# would let a `pip install` in the ComfyUI venv silently move a pin the model
# checkpoints were trained against. See env/requirements.txt for what the venv needs
# and env/setup.sh for how it is built.
dependencies = []

[project.urls]
Repository = "https://github.com/korayulusan/ComfyUI-TrajectoryForcing"

[tool.comfy]
PublisherId = "korayulusan"
DisplayName = "Trajectory Forcing"
# Square PNG, served from the repo. 400x400, which is the registry's stated
# maximum -- larger is not sharper here, it is rejected. Source of truth is
# docs/img/logo/favicon.svg; see CONTRIBUTING.md.
Icon = "https://raw.githubusercontent.com/KorayUlusan/ComfyUI-TrajectoryForcing/main/docs/img/logo/icon.png"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
